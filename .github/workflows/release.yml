name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: flutter java

      - name: Check that the tag matches pubspec.yaml
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"

      - name: Run the tests
        run: flutter test --exclude-tags golden

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "$RUNNER_TEMP/upload.jks" > android/key.properties

      - name: Build the APK
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --split-debug-info=build/debug-info
          mv build/app/outputs/flutter-apk/app-release.apk "Morg-$GITHUB_REF_NAME.apk"

      - name: Keep the debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: debug-info-${{ github.ref_name }}
          path: build/debug-info
          retention-days: 90

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "Morg-$GITHUB_REF_NAME.apk"
          --title "Morg $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
