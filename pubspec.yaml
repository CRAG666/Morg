name: morg
description: "Visor de documentos Norg."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  open_filex: ^5.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  re_highlight: ^0.0.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/guia.norg
    - assets/config/
    - assets/themes/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
        - asset: assets/fonts/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic
    - family: SymbolsNerdFontMono
      fonts:
        - asset: assets/fonts/SymbolsNerdFontMono-Regular.ttf
