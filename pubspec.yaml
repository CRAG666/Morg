name: morg
description: "Mobile viewer and editor for Norg (Neorg) notes."
publish_to: 'none'
version: 1.0.0+19

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  intl: any
  jovial_svg: ^1.1.31
  open_filex: ^5.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  pool: ^1.5.3
  re_highlight: ^0.0.3
  saf_stream: ^4.0.2
  saf_util: ^3.1.1
  super_sliver_list: ^0.4.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/docs/
    - assets/config/
    - assets/themes/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
        - asset: assets/fonts/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic
    - family: SymbolsNerdFontMono
      fonts:
        - asset: assets/fonts/SymbolsNerdFontMono-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#192019"
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#192019"
    theme_color: "#192019"
